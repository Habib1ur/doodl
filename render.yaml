services:
  - type: web
    name: doodlio-server
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm db:generate && pnpm --filter @doodlio/shared build && pnpm --filter @doodlio/server build
    startCommand: pnpm --filter @doodlio/server start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
